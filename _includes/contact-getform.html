<!-- Direct email contact form layout -->

<form onsubmit="sendEmail(); return false;">
  <div class="form-group">
    <label for="contact_form_name">Your Name :</label>
    <input 
      type="text" 
      class="form-control" 
      name="name" 
      id="contact_form_name" 
      placeholder="Enter Your Name"
    >
  </div>

  <div class="form-group">
    <label for="contact_form_email">Your Email :</label>
    <input 
      type="email" 
      class="form-control" 
      name="email" 
      id="contact_form_email" 
      placeholder="Enter Your Email"
    >
  </div>

  <div class="form-group">
    <label for="contact_form_message">Your Message :</label>
    <textarea 
      name="message" 
      class="form-control" 
      id="contact_form_message" 
      placeholder="Enter Your Message">
    </textarea>
  </div>

  <button type="submit" class="btn btn-lg btn-dark">Submit</button>
</form>

<script>
  function sendEmail() {
    var name = document.getElementById("contact_form_name").value;
    var email = document.getElementById("contact_form_email").value;
    var message = document.getElementById("contact_form_message").value;

    var subject = encodeURIComponent("Portfolio Contact");
    var body = encodeURIComponent(
      "Name: " + name + "\n" +
      "Email: " + email + "\n\n" +
      "Message:\n" + message
    );

    window.location.href = "mailto:josephflammia12@outlook.com?subject=" + subject + "&body=" + body;
  }
</script>
